<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 01 - Checkout</title>
</head>

<body>
    <form action="">
        <h2>Checkout</h2>
        <Label>Payment Method</Label>
        <select>
            <option value="">Visa Ending in 4566</option>
            <option value="">American Express Ending in 9122</option>
            <option value="">Discover Ending in 9866</option>
        </select>
        <fieldset>
            <legend>Shipping Method:</legend>
            <input type="radio" id="method-1" name="Shipping_method" value="">
            <label for="method-1">Free - 2 Day Shipping</label><br>
            <input type="radio" id="method-2" name="Shipping_method" value="">
            <label for="method-2">Standar Shipping (4-5 Business Days)</label><br>
            <input type="radio" id="method-3" name="Shipping_method" value="">
            <label for="method-3">FREE - No Rush Shipping (5 Business Days)</label>
        </fieldset>
        <br>
        <label for="selec_options">This is a giff</label>
        <input type="checkbox" name="" id="selec_options">
        <br>
        <input type="button" value="Place Your Order">
    </form>

</body>

</html>
